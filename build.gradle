plugins {
    id 'base'
}

task buildWeb(type: Exec) {
    commandLine 'npm', 'run', 'build'
}

task buildRealApk(type: Exec) {
    dependsOn buildWeb
    commandLine 'python3', 'scripts/build_real_apk.py'
}

task assembleDebug {
    dependsOn buildRealApk
}

task assembleRelease {
    dependsOn buildRealApk
}

assemble.dependsOn assembleDebug, assembleRelease

task bundleRelease {
    dependsOn buildRealApk
}

task bundleDebug {
    dependsOn buildRealApk
}

task lint(type: Exec) {
    commandLine 'npm', 'run', 'lint'
}
